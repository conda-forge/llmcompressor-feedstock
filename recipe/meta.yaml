{% set name = "llmcompressor" %}
{% set version = "0.14.0" %}

package:
  name: llmcompressor
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/l/llmcompressor/llmcompressor-{{ version }}.tar.gz
  sha256: af25a7bd7b08ff4713e719ab960f56d2e4e8c737a745ee7e5aae3f8570440c43

build:
  entry_points:
    - llmcompressor.trace=llmcompressor.transformers.tracing.debug:main
  noarch: python
  script:
    - export SETUPTOOLS_SCM_PRETEND_VERSION="$PKG_VERSION"   # [unix]
    - set "SETUPTOOLS_SCM_PRETEND_VERSION=%PKG_VERSION%"     # [win]
    - export BUILD_TYPE=release  # [unix]
    - set "BUILD_TYPE=release"  # [win]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - setuptools
    - wheel
    - setuptools-scm ==8.2.0
    - pip
  run:
    - python >={{ python_min }}
    - loguru >=0.7.2,<=0.7.3
    - pyyaml >=6.0.1,<=6.0.3
    - numpy >=2.0.0,<=2.5.3
    - requests >=2.32.2,<2.35.0
    - tqdm >=4.66.3,<=4.70.1
    - pytorch >=2.10.0,<=2.14.0
    - transformers >=5.15.0,<=5.17.0
    - datasets >=4.8.4,<=5.0.1
    - auto-round >=0.14.1,<=0.15.1
    - accelerate ==1.15.0
    - nvidia-ml-py >=12.560.30,<=13.610.43
    - pillow >=10.4.0,<13.0.0
    - compressed-tensors ==0.19.0

test:
  imports:
    - llmcompressor
    - llmcompressor.modifiers.autoround
  commands:
    - pip check
    - llmcompressor.trace --help
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://github.com/vllm-project/llm-compressor
  summary: A library for compressing large language models utilizing the latest techniques and research in the field for both training aware and post training techniques. The library is designed to be flexible and easy to use on top of PyTorch and HuggingFace Transformers, allowing for quick experimentation.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - timkpaine
